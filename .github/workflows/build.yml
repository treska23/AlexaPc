name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore AlexaPc.sln

      - name: Build
        run: dotnet build AlexaPc.sln --configuration Release --no-restore

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Cloudflare relay
        working-directory: cloudflare/worker
        run: |
          if (Test-Path node_modules) { Remove-Item node_modules -Recurse -Force }
          npm ci
          npx wrangler deploy --dry-run --outdir dist
